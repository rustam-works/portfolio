<body class="ids">
    <main>
        <div class="ids__wrapper">
            <div class="ids__space S"></div>
            <p class="ids__footnote"><a href="../">← rustam.works</a></p>
            <div class="ids__space M"></div>

            <header class="type-head">
                <h1><strong>Rustam Mushraipov</strong> — type designer wannabe.</h1>
                <p class="ids__text-meta">Need a wordmark, lettering, or anything else made of letters? Write me. I’ll draw it, you pay what you want.</p>
                <div class="type-contacts">
                    <a href="mailto:rustam.mushraipov@gmail.com">rustam.mushraipov@gmail.com</a>
                    <a href="https://t.me/rustam_works" target="_blank" rel="noopener">Telegram</a>
                </div>
            </header>

            <div class="ids__space L"></div>

            <!-- Сетка: раскладка по макетам Рустама. 1 модуль = 1/48 ширины колонки.
                 --x/--y — левый верхний угол букв, --w/--h — их размер (картинки обрезаны по буквам).
                 t-panel — чёрная панель; работы в ней стоят в % от панели (--l/--t, ширина --iw).
                 Порядок в разметке = порядок на телефоне. -->
            <div class="type-board">
            <div class="type-free" style="--rows: 148.55">
                <figure class="t" style="--x: 0.04; --y: 0; --w: 47.96; --h: 12.11">

                </figure>
